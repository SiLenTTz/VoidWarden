; VoidWarden Firmware (docs/architecture.md §2). Versionen exakt gepinnt (ADR-0003).

[platformio]
default_envs = native

; Host-Tests (Unity): nur hostfähige Logik (protocol/, state/), kein Arduino-
; Include. test_build_src_filter zieht die Quellen in den Test-Build.
[env:native]
platform = native@1.2.1
build_flags = -std=c++17 -Isrc -Wall
test_framework = unity
build_src_filter = +<protocol/> +<state/>
; Test-Build bindet die Quellen direkt ein (siehe test/test_fixtures.cpp) —
; zuverlässiger als test_build_src_filter-Unterstützung je nach PIO-Version.
extra_scripts = pre:generate_fixture_list.py

[env:esp32]
platform = espressif32@8.0.0
framework = arduino
board = esp32dev ; belegt: ESP32-D0WD-V3 (Messlauf 2026-11-03)
monitor_speed = 921600
upload_speed = 921600
build_flags =
    -std=c++17
    -DVOIDWARDEN_FW_VERSION=0x000200
build_src_filter = +<*> -<spike.cpp> -<touchprobe.cpp> ; Spike-Sketch hat eigenes env
board_build.partitions = voidwarden.csv ; app 2,25 MB + LittleFS 1,75 MB (Spike-Messlauf §Stufe 3)
board_build.filesystem = littlefs
; Grafik: LovyanGFX@1.2.36 (ADR-0003; 1.2.0 inkompatibel mit arduino-esp32 3.x)
lib_deps = lovyan03/LovyanGFX@1.2.36

; EPIC-P0 T0.5 Hardware-Spike (Board-Identifikation; LittleFS/Serial-Echo).
[env:spike]
platform = espressif32@8.0.0
framework = arduino
board = esp32dev
monitor_speed = 921600
upload_speed = 921600
build_flags = -std=c++17
build_src_filter = -<*> +<spike.cpp>
board_build.partitions = spike-partitions.csv
board_build.filesystem = littlefs
; T0.5/T2.1: Grafikbibliothek mit DMA (ADR-0003), exakt gepinnt
lib_deps = lovyan03/LovyanGFX

; EPIC-P3 T3.8: Touch-Controller-Probe (Rohwerte), nur Diagnose.
[env:touchprobe]
platform = espressif32@8.0.0
framework = arduino
board = esp32dev
monitor_speed = 921600
upload_speed = 921600
build_flags = -std=c++17
build_src_filter = -<*> +<touchprobe.cpp>
